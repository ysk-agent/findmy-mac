name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK platform 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Run unit tests
        # SrpClientTest pins the SRP-6a maths to fixed vectors; a
        # failure here must stop the release, so this runs (and gates)
        # before the APK build.
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Decode signing keystore
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_B64" ]; then
            echo "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing.keystore"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/signing.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          SIGNING_STORE_PASS: ${{ secrets.SIGNING_STORE_PASS }}
          SIGNING_KEY_PASS: ${{ secrets.SIGNING_KEY_PASS }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Name the release artifact
        # Fixed APK file name across all releases: findmy-mac.apk
        run: cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/findmy-mac.apk

      - name: Verify APK signature
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/findmy-mac.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch app on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # Single-line script on purpose: the runner executes multi-line
          # inline scripts line-by-line in separate shells, which breaks
          # variables and exit codes. The real test lives in ci/.
          script: bash ci/emulator-launch-test.sh

      - name: Upload launch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-diagnostics
          path: |
            logcat.txt
            dumpsys-activities.txt
            window_dump.xml
            screenshot-login.png
          if-no-files-found: warn

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: findmy-mac-apk
          path: app/build/outputs/apk/release/findmy-mac.apk
          if-no-files-found: error

      # Tag builds (vX.Y.Z) publish a GitHub Release carrying the APK
      # plus an update.json in the shared extended format (the shape
      # Apps Updater's GitHubSource reads: file / versionName /
      # versionCode / sha256 / size). Version fields are read back
      # from the built APK itself, never restated by hand. Branch and
      # dispatch builds stop at the artifact upload above.
      - name: Generate update.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          APK=app/build/outputs/apk/release/findmy-mac.apk
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          BADGING=$("$AAPT2" dump badging "$APK" | head -1)
          VERSION_NAME=$(echo "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          VERSION_CODE=$(echo "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")
          SHA256=$(sha256sum "$APK" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$APK")
          printf '%s' "{\"file\": \"findmy-mac.apk\", \"versionName\": \"$VERSION_NAME\", \"versionCode\": $VERSION_CODE, \"sha256\": \"$SHA256\", \"size\": $SIZE}" > update.json
          cat update.json

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              app/build/outputs/apk/release/findmy-mac.apk update.json --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              app/build/outputs/apk/release/findmy-mac.apk update.json \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
